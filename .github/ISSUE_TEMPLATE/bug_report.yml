name: Bug report
description: 报告可复现的产品或构建问题
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢报告问题。安全漏洞请使用私密 Security Advisory，不要在这里披露。
  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，未发现相同问题。
          required: true
        - label: 我已移除日志中的密码、令牌、Cookie、payload、个人路径和其他敏感信息。
          required: true
        - label: 这不是需要私密处理的安全漏洞。
          required: true
  - type: dropdown
    id: platform
    attributes:
      label: 平台
      options:
        - macOS
        - Windows（规划中）
        - Linux（规划中）
        - Android（规划中）
        - Rust Core
        - CI / 文档
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本或 commit
      placeholder: 例如 main@abcdef0
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境
      description: 操作系统版本、硬件架构、Xcode/Swift/Rust 版本及相关权限状态。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: 已脱敏的诊断信息
      description: 仅提供解决问题所需的最少信息；可留空。
      render: shell
