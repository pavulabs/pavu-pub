name: Feature request
description: 建议新的能力或改进
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue 和路线图。
          required: true
        - label: 该建议遵守本地优先、数据最少化和不解密 TLS 的产品边界。
          required: true
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 请描述用户场景和当前风险，不要只描述实现方式。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: 涉及平台
      multiple: true
      options:
        - 跨平台 Core
        - macOS
        - Windows
        - Linux
        - Android
        - 文档 / CI
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: 隐私、权限和安全影响
      description: 说明新增数据、系统权限、外部通信或误报风险；没有也请写“无”。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 可选方案
      description: 如有，请说明考虑过的替代方案。
